networks:
  media-network:
    external: true
  nginx:
    external: true

services:
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    logging:
      driver: json-file
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=America/New_York
    volumes:
      - ./radarr:/config
      - /hawth/home/data:/data
    networks:
      - media-network
      - nginx
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    logging:
      driver: json-file
    ports:
      - 8989:8989
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=America/New_York
    volumes:
      - ./sonarr:/config
      - /hawth/home/data:/data
    networks:
      - media-network
      - nginx
    restart: unless-stopped

  lidarr:
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:nightly
    ports:
      - "8686:8686"
    environment:
      - PUID=1000
      - PGID=1001
      - UMASK=002
      - TZ=America/New_York
      - WEBUI_PORTS=8686/tcp
    volumes:
      - ./lidarr:/config
      - /hawth/home/data:/data
    networks:
      - media-network
      - nginx
    restart: unless-stopped

#  bazarr:
