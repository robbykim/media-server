#      - nginx
#    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1001
      - UMASK=002
      - TZ=America/New_York
    volumes:
      - ./prowlarr:/config
    networks:
      - media-network
      - nginx
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    labels:
      glance.name: Flaresolverr
      glance.icon: di:flaresolverr
      glance.description: Cloudflare solver
      glance.hide: false
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    ports:
      - 8191:8191
    networks:
      - media-network
      - nginx
    restart: unless-stopped

  jellyseer:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
    ports:
      - 5055:5055
    volumes:
      - ./jellyseer:/app/config
    networks:
      - media-network
      - nginx
    restart: unless-stopped

