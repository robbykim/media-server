networks:
  media-network:
    external: true
  nginx:
    external: true

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - "44"
      - "105"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /hawth/home/data/media
        target: /data/media
      - type: bind
        source: /hawth/home/data/media
        target: /data/media2
        read_only: true
    ports:
      - 8096:8096
    networks:
      - media-network
      - nginx
    restart: 'unless-stopped'
